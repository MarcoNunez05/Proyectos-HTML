  <title>Lista de tareas</title>
  <link href="./output.css" rel="stylesheet">

                </div>

                    <button id="agregar" class="btn btn-info text-white text-md">Agregar</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../src/js/main.js"></script>
